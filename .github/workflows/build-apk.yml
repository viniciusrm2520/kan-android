name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write # necessário para publicar a Release nas tags v*

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Flutter 3.41 (mesma versão do FlutLab)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.x
          cache: true

      - name: Versões
        run: flutter --version

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK (release)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/kan-${GITHUB_REF_NAME//\//-}-${{ github.run_number }}.apk"
          ls -lh dist

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: kan-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - name: Publicar Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
